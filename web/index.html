<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Check whether a name is available across domains (RDAP), npm, and GitHub — fetched directly from your browser. No accounts, no tracking."
		/>
		<link rel="preconnect" href="https://data.iana.org" crossorigin />
		<link rel="dns-prefetch" href="https://data.iana.org" />
		<link rel="preconnect" href="https://rdap.verisign.com" crossorigin />
		<link rel="dns-prefetch" href="https://rdap.verisign.com" />
		<link rel="preconnect" href="https://rdap.publicinterestregistry.org" crossorigin />
		<link rel="dns-prefetch" href="https://rdap.publicinterestregistry.org" />
		<link rel="preconnect" href="https://pubapi.registry.google" crossorigin />
		<link rel="dns-prefetch" href="https://pubapi.registry.google" />
		<link rel="preconnect" href="https://api.github.com" crossorigin />
		<link rel="dns-prefetch" href="https://api.github.com" />
		<link rel="preconnect" href="https://registry.npmjs.org" crossorigin />
		<link rel="dns-prefetch" href="https://registry.npmjs.org" />
		<meta property="og:site_name" content="Domain Browser" />
		<meta property="og:type" content="website" />
		<meta
			property="og:title"
			content="Domain Browser — check a name across domains, packages and GitHub"
		/>
		<meta
			property="og:description"
			content="Check whether a name is available across domains (RDAP), npm, and GitHub — fetched directly from your browser."
		/>
		<meta name="twitter:card" content="summary" />
		<title>Domain Browser — check a name across domains, packages and GitHub</title>
		<script>
			(() => {
				try {
					const mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
					const light =
						mode === 'light' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
					const root = document.documentElement;
					root.classList.toggle('dark', !light);
					root.style.colorScheme = light ? 'light' : 'dark';
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<noscript>
			<p>
				Domain Browser needs JavaScript to check a name, since it queries domains (RDAP), npm, and
				GitHub directly from your browser.
			</p>
		</noscript>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
