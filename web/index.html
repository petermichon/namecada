<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Check one name against domains, package registries, and handles across dozens of public sources. Checked live, no accounts, no tracking."
		/>
		<meta property="og:site_name" content="Namecheck" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Namecheck — check one name across the registries" />
		<meta
			property="og:description"
			content="Domains, packages, and handles checked live against dozens of public sources."
		/>
		<meta name="twitter:card" content="summary" />
		<title>Namecheck — check one name across the registries</title>
		<script>
			(() => {
				try {
					const mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
					const light =
						mode === 'light' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
					const root = document.documentElement;
					root.classList.toggle('dark', !light);
					root.style.colorScheme = light ? 'light' : 'dark';
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<noscript>
			<p>Namecheck needs JavaScript to check a name against the public registries.</p>
		</noscript>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
