[package]
name = "namecada"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "serve"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
namecada-core = { path = "../../packages/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
