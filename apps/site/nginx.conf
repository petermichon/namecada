# The page is three static files, so nginx needs nothing beyond a root and a
# cache policy. Caddy terminates TLS and adds HSTS in front of this.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~* \.(css|svg|png|ico)$ {
		expires 1h;
		add_header Cache-Control "public";
	}

	add_header X-Content-Type-Options "nosniff" always;
}
