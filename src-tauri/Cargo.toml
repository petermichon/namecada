[workspace]

[package]
name = "namecheck-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "namecheck_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
namecheck-core = { path = "../rust/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
