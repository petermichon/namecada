name: Site

on:
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/site
          push: true
          tags: |
            ghcr.io/petermichon/namecada-site:latest
            ghcr.io/petermichon/namecada-site:sha-${{ github.sha }}
