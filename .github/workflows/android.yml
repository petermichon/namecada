name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "value=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the app version would publish an APK whose
      # versionCode does not match the release it is attached to.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match v$VERSION from tauri.conf.json" >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - uses: android-actions/setup-android@v4

      - name: Install the SDK pieces the template asks for
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370"

      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - run: cargo install cargo-ndk --locked

      - run: npm ci

      - run: npm run build

      - name: Generate the Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cd apps/desktop
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon-manifest.json

      - name: Build the universal APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cd apps/desktop
          npx tauri android build --apk

      # A store may cap downloads (IzzyOnDroid asks for 30 MB), and the
      # universal APK is about 47 MB because it carries four ABIs.
      - name: Build one APK per ABI
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cd apps/desktop
          npx tauri android build --apk --split-per-abi

      - name: Sign every APK
        env:
          VERSION: ${{ steps.version.outputs.value }}
          KEYSTORE_B64: ${{ secrets.NAMECADA_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.NAMECADA_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.NAMECADA_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "NAMECADA_KEYSTORE_B64 is not set; refusing to publish an unsigned APK" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          apksigner="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          out="$RUNNER_TEMP/apk"
          mkdir -p "$out"
          shopt -s nullglob
          for apk in apps/desktop/src-tauri/gen/android/app/build/outputs/apk/*/*/*-unsigned.apk; do
            name="$(basename "$apk")"
            abi="${name#app-}"
            abi="${abi%-release-unsigned.apk}"
            # Tauri names its splits arm/arm64; the APK and anything that filters
            # on ABI use Android's identifiers.
            case "$abi" in
              arm) abi=armeabi-v7a ;;
              arm64) abi=arm64-v8a ;;
            esac
            target="$out/namecada-$VERSION-$abi.apk"
            "$apksigner" sign --ks "$keystore" --ks-key-alias namecada \
              --ks-pass "env:STORE_PASS" --key-pass "env:KEY_PASS" \
              --out "$target" "$apk"
            "$apksigner" verify --print-certs "$target" | head -1
            (cd "$out" && sha256sum "$(basename "$target")" > "$(basename "$target").sha256")
          done
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apk/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/apk/*
          generate_release_notes: true
