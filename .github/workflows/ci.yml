name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # rust-toolchain.toml pins the channel and the fmt/clippy components.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: npm ci
      - run: npm run verify
      - run: npm run build
