# Dependabot keeps the four manifests and the workflow actions current. The repo
# has two npm trees (the root workspace and the standalone site) and two Cargo
# workspaces (the root one and the desktop shell's own), so each gets an entry.
#
# Version updates wait out GitHub's default three-day cooldown, so a compromised
# release does not reach a PR the hour it ships; security updates ignore the
# cooldown and land immediately. Minor and patch bumps are grouped to keep the
# dev-tooling churn down to one PR per tree; majors stay individual because they
# need a read.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: '/apps/site'
    schedule:
      interval: weekly
    groups:
      site-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        patterns: ['*']
        update-types: ['patch']

  - package-ecosystem: cargo
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: weekly
    groups:
      desktop-patch:
        patterns: ['*']
        update-types: ['patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
