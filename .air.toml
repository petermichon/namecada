root = "server"
tmp_dir = "tmp"

[build]
  cmd = "go -C server build -o ./tmp/domainbrowser ./cmd/domainbrowser"
  entrypoint = ["./tmp/domainbrowser", "serve"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
